name: KJS CI

on:
  push:
    branches:
      - feat/crm-kanban-evidence
  pull_request:
    branches:
      - main
      - feat/crm-kanban-evidence

permissions:
  contents: read

concurrency:
  group: kjs-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, lint, tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: ASTRA unit tests
        run: bun test packages/web/src/api/core/astra.test.ts
      - name: Typecheck
        run: bun run typecheck
      - name: Lint
        run: bun run lint
      - name: Build web
        run: bun run build:web
